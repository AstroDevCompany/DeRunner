[package]
name = "derunner"
version = "0.1.0"
description = "DeRunner - process manager & inspector"
authors = ["MintFlow Technologies"]
edition = "2021"

[lib]
name = "derunner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
semver = "1"
regex = "1"
parking_lot = "0.12"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
